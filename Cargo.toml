[package]
name = "master-control"
version = "0.0.0"
edition = "2024"
description = "The Master Control Program: the world server of the Grid - authoritative tick, roster-of-record, validation, broadcast, the logs."
license = "GPL-3.0-or-later"
repository = "https://github.com/ai-quokka-wannabe/master-control"
publish = false

[[bin]]
name = "master-control"
path = "src/main.rs"

[lib]
name = "master_control"
path = "src/lib.rs"

# The link repository's discipline, mirrored. unsafe is denied rather than forbidden so that
# exactly two modules may allow it locally: src/link_dll.rs, the boundary to the loaded wire,
# and src/stop.rs, the operating system's stop signal. Everywhere else it stays refused.
[lints.rust]
warnings = "deny"
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }

# Release, with the arithmetic still watched. A wrap that only happens at the speed of an
# optimised build is exactly the shape of a replay divergence the debug test suite can never
# reproduce, so the whole suite also runs under this profile: release codegen, overflow checks
# and debug assertions on. `cargo test --profile release-check`.
[profile.release-check]
inherits = "release"
overflow-checks = true
debug-assertions = true

# One codegen unit: build-to-build variation is one more thing a bit-for-bit world does not
# want, and this crate is small enough that the compile time is nothing.
[profile.release]
codegen-units = 1
