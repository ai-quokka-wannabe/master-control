[package]
name = "master-control"
version = "0.0.0"
edition = "2024"
description = "The Master Control Program: the world server of the Grid - authoritative tick, roster-of-record, validation, broadcast, the logs."
license = "GPL-3.0-or-later"
repository = "https://github.com/ai-quokka-wannabe/master-control"
publish = false

[[bin]]
name = "master-control"
path = "src/main.rs"

[lib]
name = "master_control"
path = "src/lib.rs"

# The link repository's discipline, mirrored. unsafe is denied rather than forbidden so that
# exactly one module - src/link_dll.rs, the boundary to the loaded wire - may allow it locally.
# Everywhere else it stays refused.
[lints.rust]
warnings = "deny"
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
