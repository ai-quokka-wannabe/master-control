name: CI - Main Branch

permissions:
    contents: read

# Runs are queued rather than cancelled here: unlike a pull request, every commit that lands on main
# should keep a result of its own.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

on:
    push:
        branches: [main]

    workflow_dispatch:

jobs:
    quick-checks:
        name: Quick Checks (markdown)
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup Node.js
              id: setup-node
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                node-version: "lts/*"

            - name: Get markdownlint-cli2 version
              id: mdlint-version
              run: echo "version=$(npm view markdownlint-cli2 version)" >> "$GITHUB_OUTPUT"

            # Restore cache from main branch (read-only)
            - name: Restore npm cache
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                path: ~/.npm
                key: npm-markdownlint-${{ runner.os }}-node-${{ steps.setup-node.outputs.node-version }}-mdlint-${{ steps.mdlint-version.outputs.version }}

            - name: Install markdownlint-cli2
              run: npm install -g markdownlint-cli2@${{ steps.mdlint-version.outputs.version }}

            - name: Lint markdown
              run: markdownlint-cli2 "**/*.md"

            # Save the npm cache so pull-request runs can restore it read-only.
            - name: Save npm cache
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                path: ~/.npm
                key: npm-markdownlint-${{ runner.os }}-node-${{ steps.setup-node.outputs.node-version }}-mdlint-${{ steps.mdlint-version.outputs.version }}

            # A carriage return sitting inside a line is invisible in every editor, survives
            # clang-format and markdownlint, and reads as ordinary text in review. Three reached
            # the flagship's main before this step existed there, each one a Doxygen \return
            # written through a tool chain that collapsed the escape, leaving a control character
            # and a word reading "eturn" where the tag should be.
            #
            # .gitattributes normalises to LF and this runner is Linux, so the checkout contains
            # no legitimate carriage return at all and any match is a stray. -I skips binary
            # files, and taking the file list from git keeps build outputs and untracked scratch
            # out of it.
            - name: Check for stray carriage returns
              run: |
                if git ls-files -z | xargs -0 grep -lIP '\r'; then
                    echo "::error::The files above contain a carriage return. Line endings here are LF, so it is a stray one inside a line - look for a text written through a tool that ate an escape."
                    exit 1
                fi

    build:
        name: Build (${{ matrix.os }})
        needs: quick-checks
        timeout-minutes: 20

        strategy:
            fail-fast: false

            matrix:
                os: [ubuntu-latest, windows-latest]

        runs-on: ${{ matrix.os }}

        steps:
            # The wire is a pinned submodule: the build script compiles its cdylib and copies it
            # beside every executable, which is how the residence rule holds in CI too.
            - name: Checkout repository (with the wire)
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                submodules: true

            - name: Update the stable toolchain
              run: |
                rustup update --no-self-update stable
                rustup default stable
                cargo --version
                rustc --version

            - name: Formatting must be canonical
              run: cargo fmt --check

            - name: Clippy, warnings as errors
              run: cargo clippy --all-targets -- --deny warnings

            - name: Test (unit, twin and the whole world stood up)
              run: cargo test

    ci-success:
        name: CI Success
        needs: [quick-checks, build]
        runs-on: ubuntu-latest
        if: always()

        steps:
            - name: Check if all jobs succeeded
              run: |
                if [[ "${{ needs.quick-checks.result }}" != "success" ]] || \
                   [[ "${{ needs.build.result }}" != "success" ]]; then
                    echo "One or more jobs failed"
                    exit 1
                fi
                echo "All jobs completed successfully"
