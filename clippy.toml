# The hidden-state rule, enforced by the linter rather than by review. The world replays bit
# for bit only if nothing in the simulation depends on an iteration order the language does not
# promise, on a clock the replay does not have, or on arithmetic another machine's libm rounds
# differently. Each entry names the rule it keeps; a module that must break one - the heartbeat,
# which owns the one wall clock; a test that holds the world's trigonometry against the
# platform's - says so with an allow and a comment, which is the visible, greppable exception
# the rule wants.
disallowed-types = [
    { path = "std::collections::HashMap", reason = "iteration order is not a promise; a BTreeMap orders by key and replays" },
    { path = "std::collections::HashSet", reason = "iteration order is not a promise; a BTreeSet orders by key and replays" },
    { path = "std::time::Instant", reason = "the tick loop is the one place a wall clock may exist (heartbeat.rs)" },
    { path = "std::time::SystemTime", reason = "the tick loop is the one place a wall clock may exist (heartbeat.rs)" },
]
disallowed-methods = [
    { path = "std::time::Instant::now", reason = "the tick loop is the one place a wall clock may exist (heartbeat.rs)" },
    { path = "std::time::SystemTime::now", reason = "the tick loop is the one place a wall clock may exist (heartbeat.rs)" },
    # The world owns its transcendentals (src/trig.rs): the platform's libm rounds some arguments
    # differently on different machines, and a world that replays bit for bit on any machine
    # may use nothing but IEEE basic arithmetic between its state and its next state. Tests
    # that hold ours against the platform's, within a tolerance, say so with an allow.
    { path = "f32::sin", reason = "the world owns its transcendentals: trig::sin" },
    { path = "f32::cos", reason = "the world owns its transcendentals: trig::cos" },
    { path = "f32::sin_cos", reason = "the world owns its transcendentals: trig::sin_cos" },
    { path = "f32::tan", reason = "the world owns its transcendentals: none is provided; ask" },
    { path = "f32::atan", reason = "the world owns its transcendentals: trig::atan2" },
    { path = "f32::atan2", reason = "the world owns its transcendentals: trig::atan2" },
    { path = "f32::asin", reason = "the world owns its transcendentals: none is provided; ask" },
    { path = "f32::acos", reason = "the world owns its transcendentals: none is provided; ask" },
    { path = "f32::exp", reason = "the world owns its transcendentals: none is provided; ask" },
    { path = "f32::ln", reason = "the world owns its transcendentals: none is provided; ask" },
    { path = "f32::powf", reason = "the world owns its transcendentals: none is provided; ask" },
    { path = "f64::sin", reason = "the world owns its transcendentals: trig::sin (f32 is the world's precision)" },
    { path = "f64::cos", reason = "the world owns its transcendentals: trig::cos (f32 is the world's precision)" },
    { path = "f64::sin_cos", reason = "the world owns its transcendentals: trig::sin_cos (f32 is the world's precision)" },
    { path = "f64::atan2", reason = "the world owns its transcendentals: trig::atan2 (f32 is the world's precision)" },
]
